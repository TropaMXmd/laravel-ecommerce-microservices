networks:
  internal: # service-to-service (never exposed)
    driver: bridge
  public: # nginx → host
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./db_data/redis_data:/data
  # ── RabbitMQ ────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672' # AMQP — only needed on host for local debugging; remove if you want it fully internal
      - '15672:15672' # Management UI — convenient to keep exposed during dev
    environment:
      RABBITMQ_DEFAULT_USER: ecomstarter
      RABBITMQ_DEFAULT_PASS: ecomstarter_dev_pw # change for anything beyond local dev
    volumes:
      - ./db_data/rabbitmq:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    volumes:
      - ./auth-service:/var/www
      - ./packages:/var/packages
    working_dir: /var/www
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - internal
  auth-nginx:
    image: nginx:alpine
    container_name: auth-nginx
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./auth-service:/var/www
      - ./docker/nginx/auth.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal
      - public
    depends_on:
      - auth-service
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${AUTH_DB_DATABASE:-auth_db}
      MYSQL_USER: ${AUTH_DB_USERNAME:-auth_user}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - ./db_data/auth:/var/lib/mysql
      - ./docker/mysql/auth-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '33062:3306' # host access for GUI tools
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${ORDER_DB_ROOT_PASSWORD:-rootsecret}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  # Inventory Service
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    volumes:
      - ./inventory-service:/var/www
      - ./packages:/var/packages
    working_dir: /var/www
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - internal
  inventory-nginx:
    image: nginx:alpine
    container_name: inventory-nginx
    restart: unless-stopped
    ports:
      - '8001:80'
    volumes:
      - ./inventory-service:/var/www
      - ./docker/nginx/inventory.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal
      - public
    depends_on:
      - inventory-service
  inventory-db:
    image: mysql:8.0
    container_name: inventory-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${INVENTORY_DB_DATABASE:-inventory_db}
      MYSQL_USER: ${INVENTORY_DB_USERNAME:-inventory_user}
      MYSQL_PASSWORD: ${INVENTORY_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${INVENTORY_DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - ./db_data/inventory:/var/lib/mysql
      - ./docker/mysql/inventory-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '33063:3306' # host access for GUI tools
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${INVENTORY_DB_ROOT_PASSWORD:-rootsecret}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  # ── Inventory Service — RabbitMQ consumer worker ───────────────────────────
  # Separate long-running process from the HTTP-serving container above.
  # Runs `php artisan inventory:consume`, which blocks forever consuming
  # order.placed / order.confirmed / order.cancelled.
  inventory-consumer:
    build: ./inventory-service
    container_name: inventory-consumer
    restart: unless-stopped
    command: php artisan inventory:consume
    volumes:
      - ./inventory-service:/var/www
      - ./packages:/var/packages
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=ecomstarter
      - RABBITMQ_PASSWORD=ecomstarter_dev_pw
    depends_on:
      rabbitmq:
        condition: service_healthy
      inventory-db:
        condition: service_started
    networks:
      - internal
    # ── Inventory Service — Laravel scheduler loop ─────────────────────────────
  # Runs `php artisan schedule:run` every 60s. This is what actually fires
  # PublishOutboxMessagesJob (every 5s) and ReleaseExpiredReservationsJob
  # (every minute) — neither job runs on its own just because it's registered
  # in bootstrap/app.php. Nothing else in the stack calls schedule:run.
  inventory-scheduler:
    build: ./inventory-service
    container_name: inventory-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - ./inventory-service:/var/www
      - ./packages:/var/packages
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=ecomstarter
      - RABBITMQ_PASSWORD=ecomstarter_dev_pw
    depends_on:
      rabbitmq:
        condition: service_healthy
      inventory-db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - internal
  # Order Service
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    volumes:
      - ./order-service:/var/www
    working_dir: /var/www
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - internal
  order-nginx:
    image: nginx:alpine
    container_name: order-nginx
    restart: unless-stopped
    ports:
      - '8002:80'
    volumes:
      - ./order-service:/var/www
      - ./docker/nginx/order.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal
      - public
    depends_on:
      - order-service
  order-db:
    image: mysql:8.0
    container_name: order-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${ORDER_DB_DATABASE:-order_db}
      MYSQL_USER: ${ORDER_DB_USERNAME:-order_user}
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - ./db_data/order:/var/lib/mysql
      - ./docker/mysql/order-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '33061:3306' # host access for GUI tools
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${ORDER_DB_ROOT_PASSWORD:-rootsecret}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
